name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: sqlite
            url: ""
          - db: postgres
            url: postgres://postgres:pw@127.0.0.1:5432/rangoli
          - db: mysql
            url: mysql://root:pw@127.0.0.1:3306/rangoli
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: rangoli
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pw
          MYSQL_DATABASE: rangoli
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -ppw" --health-interval 2s --health-retries 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
        env:
          RANGOLI_TEST_DATABASE_URL: ${{ matrix.url }}

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Run the example app and drive the admin
        working-directory: examples/blog
        env:
          RANGOLI_DEBUG: "1"
          RANGOLI_PASSWORD: browser-check-pw
        run: |
          cargo build
          cargo run -- migrate
          cargo run -- createsuperuser admin
          (cargo run -- runserver &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8000/admin/login && break; sleep 1; done
          python ../../scripts/browser_check.py http://127.0.0.1:8000 admin browser-check-pw

  storage:
    name: S3 uploads (SeaweedFS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: An S3-compatible server with a private bucket
        run: |
          mkdir -p /tmp/s3cfg
          echo '{"identities":[{"name":"ci","credentials":[{"accessKey":"cikey","secretKey":"cisecret123"}],"actions":["Admin","Read","Write","List"]}]}' > /tmp/s3cfg/s3.json
          docker run -d --name s3 -p 8333:8333 -v /tmp/s3cfg:/etc/s3 chrislusf/seaweedfs server -s3 -s3.config=/etc/s3/s3.json -dir=/data
          for i in $(seq 1 60); do curl -s -o /dev/null 127.0.0.1:8333 && break; sleep 1; done; sleep 3
          docker exec s3 sh -c "echo 's3.bucket.create -name rangoli-ci' | weed shell"
      - run: cargo test -p rangoli --test storage
        env:
          RANGOLI_TEST_S3_ENDPOINT: http://127.0.0.1:8333
          RANGOLI_TEST_S3_BUCKET: rangoli-ci
          RANGOLI_TEST_S3_KEY: cikey
          RANGOLI_TEST_S3_SECRET: cisecret123

  outage:
    name: database outage (postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p blog
      - run: scripts/outage_check.sh

  fuzz:
    name: robustness fuzz (long)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test robustness
        env:
          ROBUSTNESS_ITERS: "3000"

  features:
    name: minimal builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: every database alone, and each optional part alone
        run: |
          for f in postgres mysql sqlite sqlite,admin sqlite,web postgres,realtime; do
            echo "== $f"
            cargo clippy -p rangoli --no-default-features --features "$f" --all-targets -- -D warnings
          done
      - run: cargo test -p rangoli --no-default-features --features sqlite
      - run: cargo build -p api_only
