name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: sqlite
            url: ""
          - db: postgres
            url: postgres://postgres:pw@127.0.0.1:5432/rangoli
          - db: mysql
            url: mysql://root:pw@127.0.0.1:3306/rangoli
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: rangoli
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pw
          MYSQL_DATABASE: rangoli
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -ppw" --health-interval 2s --health-retries 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
        env:
          RANGOLI_TEST_DATABASE_URL: ${{ matrix.url }}

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Run the example app and drive the admin
        working-directory: examples/blog
        env:
          RANGOLI_DEBUG: "1"
          RANGOLI_PASSWORD: browser-check-pw
        run: |
          cargo build
          cargo run -- migrate
          cargo run -- createsuperuser admin
          (cargo run -- runserver &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8000/admin/login && break; sleep 1; done
          python ../../scripts/browser_check.py http://127.0.0.1:8000 admin browser-check-pw

  outage:
    name: database outage (postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p blog
      - run: scripts/outage_check.sh

  fuzz:
    name: robustness fuzz (long)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test robustness
        env:
          ROBUSTNESS_ITERS: "3000"
