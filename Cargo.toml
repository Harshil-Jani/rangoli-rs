[workspace]
resolver = "2"
members = ["rangoli", "rangoli-macros", "examples/blog", "examples/api_only"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Harshil-Jani/rangoli-rs"
rust-version = "1.82"

# Dependencies (argon2, sqlite, ...) optimized even in debug builds: password hashing
# alone takes seconds unoptimized, which makes tests slow and timing-sensitive.
[profile.dev.package."*"]
opt-level = 2
