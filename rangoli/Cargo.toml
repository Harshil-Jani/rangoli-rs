[package]
name = "rangoli"
description = "A batteries-included, Django-style web framework for Rust: typed ORM, migrations, admin, auth"
keywords = ["web", "framework", "orm", "admin", "django"]
categories = ["web-programming::http-server", "database"]
readme = "../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rangoli-macros = { version = "0.2.0", path = "../rangoli-macros" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "any"] }
minijinja = { version = "2", features = ["loader"], optional = true }
argon2 = "0.5"
getrandom = "0.3"
# Already compiled in through sqlx; hashes API tokens.
sha2 = "0.10"
# Already compiled in through rustls; AES-256-GCM for encrypted fields.
ring = "0.17"
# Outgoing webhooks over HTTPS: hyper, rustls and webpki-roots are already in the tree; only
# tokio-rustls is new.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
webpki-roots = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_urlencoded = "0.7"
rpassword = "7"
futures-util = { version = "0.3", default-features = false, optional = true }
tower-http = { version = "0.6", features = ["catch-panic", "timeout"] }
# Already in the tree through axum; the MCP server calls the JSON API router with it.
tower = { version = "0.5", features = ["util"] }
# The SQLite sqlx already links; used only to switch off its global memory statistics.
libsqlite3-sys = { version = "0.30", optional = true }

[features]
# Everything on by default; an API-only Postgres service can use
# `default-features = false, features = ["postgres"]` and compile none of the rest.
default = ["admin", "web", "realtime", "webhooks", "postgres", "mysql", "sqlite"]
admin = ["dep:minijinja", "dep:futures-util", "dep:bytes"]
web = ["dep:minijinja", "tower-http/fs"]
realtime = ["axum/ws", "dep:futures-util"]
webhooks = ["dep:tokio-rustls", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes", "dep:webpki-roots"]
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
sqlite = ["sqlx/sqlite", "dep:libsqlite3-sys"]

[dev-dependencies]
serde_urlencoded = "0.7"
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tower = { version = "0.5", features = ["util"] }
# Already in the tree; raw connections for the zero-downtime migration test.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any"] }
