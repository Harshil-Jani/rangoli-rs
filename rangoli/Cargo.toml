[package]
name = "rangoli"
description = "A batteries-included, Django-style web framework for Rust: typed ORM, migrations, admin, auth"
keywords = ["web", "framework", "orm", "admin", "django"]
categories = ["web-programming::http-server", "database"]
readme = "../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rangoli-macros = { version = "0.1.0", path = "../rangoli-macros" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "postgres", "mysql", "sqlite"] }
minijinja = { version = "2", features = ["loader"] }
argon2 = "0.5"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_urlencoded = "0.7"
rpassword = "7"
tower-http = { version = "0.6", features = ["fs"] }
# The SQLite sqlx already links; used only to switch off its global memory statistics.
libsqlite3-sys = "0.30"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tower = { version = "0.5", features = ["util"] }
