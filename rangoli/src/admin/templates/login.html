{% extends "base.html" %}
{% block content %}
<div class="login">
  <h1>Log in</h1>
  {% if error %}<p class="flash error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login" hx-boost="false">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="row"><label for="username">Username</label><input id="username" name="username" value="{{ username or "" }}" autocomplete="username" required autofocus></div>
    <div class="row"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn wide">Log in</button>
  </form>
</div>
{% endblock %}
