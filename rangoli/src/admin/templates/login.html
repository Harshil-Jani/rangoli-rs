{% extends "base.html" %}
{% block bodyclass %}login{% endblock %}
{% block breadcrumbs %}{% endblock %}
{% block head %}<h1>Log in</h1>{% endblock %}
{% block content %}
{% if error %}<p class="message error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/admin/login" class="stack" hx-boost="false">
  <label for="id_username">Username</label>
  <input type="text" name="username" id="id_username" value="{{ username or "" }}" autocomplete="username" maxlength="150" required autofocus>
  <label for="id_password">Password</label>
  <input type="password" name="password" id="id_password" autocomplete="current-password" required>
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit" class="btn primary">Log in</button>
</form>
{% endblock %}
